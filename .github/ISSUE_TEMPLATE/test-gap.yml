name: Test gap
description: Propose independent acceptance coverage
title: "test-gap: "
labels:
  - test-gap
body:
  - type: textarea
    id: invariant
    attributes:
      label: Invariant
      description: What behavior must remain true?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction and evidence
      description: Describe a deterministic reproduction and the evidence that should be retained.
    validations:
      required: true
  - type: dropdown
    id: classification
    attributes:
      label: Expected failure classification
      options:
        - product regression
        - blocked dependency
        - harness regression
        - unknown pending investigation
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      options:
        - pull-request contract
        - scheduled integration
        - emulator or desktop
        - chaos or scale
        - security
    validations:
      required: true
